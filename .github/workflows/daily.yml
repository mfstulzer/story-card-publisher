name: Daily Instagram story

on:
  schedule:
    # One run per expected post, each timed to land AFTER its Typefully slot in
    # BOTH halves of the year. GitHub cron has no DST awareness, so every value
    # is picked against the WINTER offset (CST, UTC-6), the tighter of the two;
    # in summer (CDT, UTC-5) each simply fires an hour later in local terms.
    # Rule: a post at local T needs cron hour >= T+6.
    #
    # Mon-Fri, posts at 08:00 and 11:00 local:
    - cron: "10 14 * * 1-5"   # 09:10 CDT / 08:10 CST  -> cards the 08:00 post
    - cron: "10 17 * * 1-5"   # 12:10 CDT / 11:10 CST  -> cards the 11:00 post
    # Sunday, posts at 10:00 and 13:00 local (Sunday slots opened 2026-08-10 and
    # are deliberately later than weekdays, so they need their own crons; the old
    # single 14:10 rule fired 09:10 CDT, i.e. BEFORE the 10:00 Sunday post):
    - cron: "10 16 * * 0"     # 11:10 CDT / 10:10 CST  -> cards the 10:00 post
    - cron: "10 19 * * 0"     # 14:10 CDT / 13:10 CST  -> cards the 13:00 post
    # Saturday has no queue slots configured, so it gets no cron.
    #
    # A late runner is harmless (cron never fires EARLY, and the publisher takes
    # the earliest post not yet carded, so runs landing out of order still card
    # one post each). MAX_PER_DAY in publish.py is the backstop.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Render only, do not publish"
        type: boolean
        default: true
      date:
        description: "Override date (YYYY-MM-DD)"
        type: string
        required: false

permissions:
  contents: write   # commit the rendered card + published-state back

jobs:
  story:
    runs-on: ubuntu-latest
    # Runners are UTC. Without this the card stamps UTC time, so a story posted
    # at 09:10 local would read "2:10 PM" next to a post that went out at 08:00.
    env:
      TZ: America/Winnipeg
    steps:
      - uses: actions/checkout@v4

      - name: Install fonts
        # Liberation Sans is the closest metric match to Helvetica in Debian.
        # Noto Color Emoji replaces Apple Color Emoji. The card will differ
        # slightly from a local render; that is expected and was accepted.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-liberation fonts-noto-color-emoji

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet pillow

      - name: Publish story
        env:
          TYPEFULLY_API_KEY: ${{ secrets.TYPEFULLY_API_KEY }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        run: |
          python publish.py \
            ${{ (inputs.dry_run == true || inputs.dry_run == 'true') && '--dry-run' || '' }} \
            ${{ inputs.date && format('--date {0}', inputs.date) || '' }}

      - name: Upload rendered card for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rendered-card
          path: cards/*.png
          if-no-files-found: ignore
